name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build app
        run: ./build.sh --universal

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Run tests
        run: ./test.sh

      - name: Package app
        run: ditto -c -k --keepParent "build/Video Inspector.app" "build/Video-Inspector.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Video-Inspector
          path: build/Video-Inspector.zip
